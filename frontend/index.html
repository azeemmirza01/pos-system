<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>POS System</title>
    <style>
      /* Ensure body and root are visible while loading */
      body {
        margin: 0;
        padding: 0;
        background-color: #f5f7fa;
      }
      #root {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        display: block;
        visibility: visible;
        opacity: 1;
      }
      /* Loading indicator */
      .app-loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-loading">Loading POS System...</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
